[versions]
mod-version = "1.3.1"
# Loom (https://github.com/FabricMC/fabric-loom)
loom = "1.14-SNAPSHOT"

[libraries]
# 与 Minecraft 版本相关的依赖（minecraft / yarn / fabric-loader / meteor-client）
# 已迁移到 versions/<mc>.properties，由 build.gradle.kts 按 -Pminecraft_version 动态加载，
# 以便同一份源码构建 1.21.1 / 1.21.4 / 1.21.11。

[plugins]
fabric-loom = { id = "fabric-loom", version.ref = "loom" }
