# =============================================================================
#  Minecraft 1.21.1 —— 最低支持版本
#  构建：gradle build -Pminecraft_version=1.21.1
# =============================================================================

# --- Minecraft / Fabric ---
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.15.11

# --- Fabric API ---
# 默认不引入依赖，理由同 1.21.11.properties；此值已核实存在于 maven。
fabric_api_version=0.116.17+1.21.1

# --- Meteor Client ---
# 实测：该构建（0.5.8-20241107.185150-94）的 fabric.mod.json 声明
#       depends.minecraft=["1.21","1.21.1"]、fabricloader>=0.15.11
#       —— 官方即支持 1.21.1，无需降级或妥协。
#
# ⚠️ 注意：Meteor 官方 maven 的 snapshot 目录只保留最新一次构建，更早的
#    timestamped 产物已被清除，无法再钉更精确的构建号。该版本线（0.6.0 之前）
#    已停止更新，实际等于冻结。
meteor_version=0.5.8-SNAPSHOT

# --- Baritone ---
baritone_version=
