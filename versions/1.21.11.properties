# =============================================================================
#  Minecraft 1.21.11 —— 当前生产基线（baseline）
#  构建：gradle build -Pminecraft_version=1.21.11
# =============================================================================

# --- Minecraft / Fabric ---
# yarn/loader 保持与迁移前基线完全一致，确保 1.21.11 构建行为零变化。
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.3
loader_version=0.18.2

# --- Fabric API ---
# 默认不引入依赖：实测 Meteor Client 的 jar 内 META-INF/jars 已内置它真正用到的
# API 模块（fabric-api-base、fabric-resource-loader-v1），单独引入反而可能造成版本冲突。
# 确需引入时，打开 build.gradle.kts 中对应的一行即可，此值已核实存在于 maven。
fabric_api_version=0.141.6+1.21.11

# --- Meteor Client ---
# 实测：该构建的 fabric.mod.json 声明 depends.minecraft=["1.21.11"]、fabricloader>=0.18.2
meteor_version=1.21.11-SNAPSHOT

# --- Baritone ---
# 本项目当前未使用 Baritone，坐标留空备用。
baritone_version=
